<script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<style>

    display: flex;
    align-items: center;

    overflow: hidden;
  }
  body.light-bg { background: #e8eaf0; }

    body { background: #F2F2F7 !important; overflow: hidden; align-items: flex-start; justify-content: flex-start; }
    #root { width: 100%; height: 100vh; height: 100dvh; position: fixed; inset: 0; }
  }
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }

  /* Mobile touch & readability fixes */
  @media (max-width: 500px) {
    input, button, select, textarea {
      font-size: 16px !important; /* prevents iOS zoom on focus */
      -webkit-tap-highlight-color: transparent;
    }
    button { min-height: 44px; }
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideDown {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .screen-anim { animation: fadeIn 0.25s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  .slide-up-anim { animation: slideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both; }

</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── DATA ───────────────────────────────────────────────────────
const IRS_RATES = { Business: 0.67, Medical: 0.21, Charity: 0.14, Moving: 0.21, Personal: 0 };
const CAT_COLORS = {
  Business:  { bg: '#007AFF', light: '#EBF4FF', text: '#007AFF' },
  Medical:   { bg: '#FF3B30', light: '#FFEEED', text: '#FF3B30' },
  Charity:   { bg: '#34C759', light: '#E8FBF0', text: '#34C759' },
  Moving:    { bg: '#FF9500', light: '#FFF5E6', text: '#FF9500' },
  Personal:  { bg: '#8E8E93', light: '#F2F2F7', text: '#8E8E93' },
};

const BUSINESS_INFO_DEFAULTS = {
  'TEJ': { full: 'TEJ Pharmacy LLC', desc: 'Independent retail pharmacy', color: '#5856D6', light: '#EEEEFB' },
  'DIA': { full: 'DIA Logistics Inc.', desc: 'Logistics & distribution', color: '#FF9500', light: '#FFF5E6' },
  'B&B': { full: 'B&B Holdings', desc: 'Retail & wholesale operations', color: '#34C759', light: '#E8FBF0' },
};
let BUSINESS_INFO = (() => {
  try {
    const s = JSON.parse(localStorage.getItem('mv_businesses') || 'null');
    if (s && typeof s === 'object' && Object.keys(s).length > 0) return s;
  } catch {}
  return { ...BUSINESS_INFO_DEFAULTS };
})();
const saveBizDB = (db) => {
  BUSINESS_INFO = db;
  localStorage.setItem('mv_businesses', JSON.stringify(db));
};
const businessOf = (entity) => {
  if (!entity) return null;
  if (BUSINESS_INFO[entity]) return entity;
  return null; // unmatched entities → "Other"
};

// ─── APP PREFS (persisted) ──────────────────────────────────────
const DEFAULT_PREFS = {
  defaultBusiness: '',          // '' | 'TEJ' | 'DIA' | 'B&B'
  hiddenCategories: [],         // e.g. ['Moving','Personal']
  notifications: true,
  gpsAutoTrack: false,
  irsAutoCheck: true,
  aiSuggestions: true,
};

// ─── AI SUGGESTION ENGINE ──────────────────────────────────────
// Pattern-matches against existing trips + keywords to suggest category + business
const aiSuggest = (trip, allTrips) => {
  const text = `${trip.from || ''} ${trip.to || ''} ${trip.purpose || ''}`.toLowerCase();
  const out = { category: null, business: null, confidence: 0, reasons: [] };

  // Find similar past trips
  const similar = allTrips.filter(t => {
    if (t.id === trip.id) return false;
    const tText = `${t.from} ${t.to} ${t.purpose}`.toLowerCase();
    const fromMatch = trip.from && t.from.toLowerCase().includes(trip.from.toLowerCase().slice(0,8));
    const toMatch = trip.to && t.to.toLowerCase().includes(trip.to.toLowerCase().slice(0,8));
    return fromMatch || toMatch;
  });
  if (similar.length > 0) {
    const cats = {};
    const bizs = {};
    similar.forEach(t => {
      cats[t.category] = (cats[t.category] || 0) + 1;
      if (t.entity) bizs[t.entity] = (bizs[t.entity] || 0) + 1;
    });
    const topCat = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
    const topBiz = Object.entries(bizs).sort((a,b)=>b[1]-a[1])[0];
    if (topCat) {
      out.category = topCat[0];
      out.confidence = Math.min(95, 60 + topCat[1]*8);
      out.reasons.push(`Matches ${similar.length} past trip${similar.length>1?'s':''} on similar route`);
    }
    if (topBiz) {
      out.business = topBiz[0];
      out.reasons.push(`Usually ${topBiz[0]} for this route`);
    }
  }

  // Keyword fallback
  if (!out.category) {
    const KEYWORDS = {
      Medical: ['hospital','clinic','doctor','medical','dentist','pharmacy visit','health','therapist','urgent care'],
      Charity: ['volunteer','donation','food bank','charity','red cross','goodwill','non-profit','church'],
      Moving:  ['moving','storage unit','u-haul','new apartment','new house'],
      Personal:['grocery','target','walmart','costco','restaurant','vacation','personal','errand'],
      Business:['client','meeting','office','warehouse','supplier','bank','tej','dia','b&b','conference','trade show','vendor'],
    };
    for (const [cat, words] of Object.entries(KEYWORDS)) {
      const hit = words.find(w => text.includes(w));
      if (hit) { out.category = cat; out.confidence = 72; out.reasons.push(`"${hit}" suggests ${cat}`); break; }
    }
  }

  // Business detection from text
  if (!out.business && trip.category === 'Business') {
    for (const biz of Object.keys(BUSINESS_INFO)) {
      if (text.includes(biz.toLowerCase())) {
        out.business = biz;
        out.reasons.push(`"${biz}" mentioned in route`);
        break;
      }
    }
  }
  return out;
};

// ─── IRS COMPLIANCE CHECKER ────────────────────────────────────
// IRS Pub 463 / §274(d): substantiation requires date, mileage, destination, business purpose
const VAGUE_TERMS = ['errand','stuff','meeting','work','business','trip','drive','visit'];
const irsCheck = (trip) => {
  const issues = [];
  const wins = [];
  if (!trip.date) issues.push({ level:'error', msg:'Date is required (IRS §274(d))' });
  else wins.push('Date logged');
  if (!trip.from || !trip.to) issues.push({ level:'error', msg:'Both start and end locations required' });
  else if (trip.from.length < 5 || trip.to.length < 5) issues.push({ level:'warn', msg:'Locations should be specific (street or business name)' });
  else wins.push('Specific locations');
  if (!trip.miles || parseFloat(trip.miles) <= 0) issues.push({ level:'error', msg:'Mileage must be greater than zero' });
  else wins.push('Mileage recorded');

  const purpose = (trip.purpose || '').trim();
  if (!purpose) issues.push({ level:'error', msg:'Business purpose is required by IRS' });
  else if (purpose.length < 10) issues.push({ level:'warn', msg:'Purpose is too brief — describe WHO and WHY (e.g. "Meeting with Dr. Smith re: Q2 inventory")' });
  else if (VAGUE_TERMS.some(v => purpose.toLowerCase() === v || purpose.toLowerCase() === v+'s')) {
    issues.push({ level:'warn', msg:`"${purpose}" is too vague. Add specifics — who you met, what was discussed.` });
  } else wins.push('Detailed business purpose');

  if (trip.category === 'Business' && !trip.entity) {
    issues.push({ level:'warn', msg:'Business entity recommended for multi-business filers' });
  } else if (trip.entity) wins.push('Entity assigned');

  const score = Math.max(0, 100 - issues.filter(i=>i.level==='error').length*30 - issues.filter(i=>i.level==='warn').length*10);
  return { issues, wins, score, compliant: issues.filter(i=>i.level==='error').length === 0 };
};

// ─── STATIC MAP RENDERER ───────────────────────────────────────
// Generates a simple SVG map representation for a trip route
function MapPreview({ trip, height = 140, accent = '#007AFF' }) {
  // Deterministic pseudo-random path based on trip id/string
  const seed = (trip.id || trip.from + trip.to).toString();
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
  const rand = (n) => { h = (h * 9301 + 49297) % 233280; return Math.abs(h % n); };

  const w = 360;
  // Generate stylized streets
  const streets = [];
  for (let i = 0; i < 8; i++) {
    const y = 15 + (i * (height-30)/8) + rand(8) - 4;
    streets.push({ y, w: rand(200) + 100, x: rand(100) });
  }
  for (let i = 0; i < 10; i++) {
    const x = 20 + (i * w/10) + rand(8) - 4;
    streets.push({ x, h: rand(80) + 40, y: rand(40), v: true });
  }

  // Route waypoints
  const startX = 30, startY = height - 30;
  const endX = w - 30, endY = 30;
  const midX1 = startX + (endX - startX) * 0.3 + rand(20) - 10;
  const midY1 = startY + (endY - startY) * 0.3 + rand(20) - 10;
  const midX2 = startX + (endX - startX) * 0.7 + rand(20) - 10;
  const midY2 = startY + (endY - startY) * 0.7 + rand(20) - 10;
  const path = `M ${startX} ${startY} Q ${midX1} ${midY1} ${midX2} ${midY2} T ${endX} ${endY}`;

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} style={{ display: 'block' }}>
      <defs>
        <pattern id={`grid-${seed.slice(0,6)}`} width="40" height="40" patternUnits="userSpaceOnUse">
          <rect width="40" height="40" fill="#F2F4F7"/>
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E8ED" strokeWidth="0.5"/>
        </pattern>
      </defs>
      <rect width={w} height={height} fill={`url(#grid-${seed.slice(0,6)})`}/>
      {/* Streets */}
      {streets.map((s,i) => s.v
        ? <rect key={i} x={s.x} y={s.y} width="3" height={s.h} fill="#E0E5EC" rx="1"/>
        : <rect key={i} x={s.x} y={s.y} width={s.w} height="3" fill="#E0E5EC" rx="1"/>
      )}
      {/* Park / water */}
      <rect x={rand(80)+200} y={rand(40)+50} width="60" height="30" fill="#D5EFD5" rx="6" opacity="0.7"/>
      <rect x={rand(60)+30} y={rand(30)+10} width="55" height="20" fill="#CFE4F5" rx="4" opacity="0.7"/>
      {/* Route path glow */}
      <path d={path} stroke={accent} strokeWidth="6" fill="none" strokeLinecap="round" opacity="0.18"/>
      <path d={path} stroke={accent} strokeWidth="3" fill="none" strokeLinecap="round" strokeDasharray="0"/>
      {/* Start marker */}
      <circle cx={startX} cy={startY} r="8" fill="white" stroke="#34C759" strokeWidth="3"/>
      <circle cx={startX} cy={startY} r="3" fill="#34C759"/>
      {/* End pin */}
      <path d={`M ${endX} ${endY-12} C ${endX-7} ${endY-12} ${endX-7} ${endY-2} ${endX} ${endY+4} C ${endX+7} ${endY-2} ${endX+7} ${endY-12} ${endX} ${endY-12} Z`} fill="#FF3B30"/>
      <circle cx={endX} cy={endY-7} r="2.5" fill="white"/>
      {/* Distance label */}
      <g transform={`translate(${(startX+endX)/2 - 28} ${(startY+endY)/2 - 10})`}>
        <rect width="56" height="20" rx="10" fill="white" stroke="#E5E5EA"/>
        <text x="28" y="13" textAnchor="middle" fontSize="11" fontWeight="700" fill="#1a1a1a" fontFamily="Inter, sans-serif">
          {trip.miles ? `${parseFloat(trip.miles).toFixed(1)} mi` : '— mi'}
        </text>
      </g>
    </svg>
  );
}


// ─── GPS LOCATION HELPER ───────────────────────────────────────
const getCurrentAddress = () => new Promise((resolve, reject) => {
  if (!navigator.geolocation) return reject('Geolocation not supported');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const { latitude: lat, longitude: lon } = pos.coords;
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const data = await res.json();
      const a = data.address || {};
      const parts = [
        a.house_number && a.road ? `${a.house_number} ${a.road}` : a.road,
        a.city || a.town || a.village || a.suburb,
        a.state,
      ].filter(Boolean);
      resolve(parts.join(', ') || `${lat.toFixed(4)}, ${lon.toFixed(4)}`);
    } catch {
      resolve(`${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`);
    }
  }, (err) => reject(err.message), { enableHighAccuracy: true, timeout: 10000 });
});

// Distance between two GPS coords in miles (Haversine)
const haversine = (lat1,lon1,lat2,lon2) => {
  const R=3958.8, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.pow(Math.sin(dLat/2),2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.pow(Math.sin(dLon/2),2);
  return R*2*Math.asin(Math.sqrt(a));
};

// ─── SWIPEABLE ROW (swipe left to delete) ──────────────────────
function SwipeableRow({ onDelete, children }) {
  const [offsetX, setOffsetX] = useState(0);
  const [swiping, setSwiping] = useState(false);
  const startX = useRef(null);
  const DELETE_THRESHOLD = 80;
  const MAX_SWIPE = 90;

  const onTouchStart = (e) => {
    startX.current = e.touches[0].clientX;
    setSwiping(false);
  };
  const onTouchMove = (e) => {
    if (startX.current === null) return;
    const dx = startX.current - e.touches[0].clientX;
    if (dx > 0) {
      setSwiping(true);
      setOffsetX(Math.min(dx, MAX_SWIPE));
    }
  };
  const onTouchEnd = () => {
    if (offsetX < DELETE_THRESHOLD) {
      setOffsetX(0);
    } else {
      setOffsetX(MAX_SWIPE);
    }
    startX.current = null;
  };
  const reset = () => setOffsetX(0);

  return (
    <div style={{ position: 'relative', overflow: 'hidden' }}>
      {/* Red delete button revealed on swipe */}
      <div style={{
        position: 'absolute', right: 0, top: 0, bottom: 0,
        width: MAX_SWIPE, background: '#FF3B30',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer',
      }} onClick={() => { reset(); onDelete(); }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <Icon name="trash" size={20} color="white" strokeWidth={2}/>
          <span style={{ fontSize: 11, color: 'white', fontWeight: 700 }}>Delete</span>
        </div>
      </div>
      {/* Row content — slides left */}
      <div
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{
          transform: `translateX(-${offsetX}px)`,
          transition: swiping ? 'none' : 'transform 0.25s ease',
          position: 'relative', zIndex: 1, background: 'white',
        }}>
        {children}
      </div>
    </div>
  );
}

function AddTripScreen({ accent, onSave, onClose, allTrips = [] }) {
  const { prefs } = React.useContext(PrefsContext);
  const [step, setStep] = useState(1); // 1=route, 2=details, 3=confirm
  const [form, setForm] = useState({
    from: '', to: '', miles: '', category: 'Business',
    purpose: '', date: new Date().toISOString().split('T')[0],
    entity: prefs.defaultBusiness || '',
    photo: null, // { name, dataUrl, type }
  });
  const [saved, setSaved] = useState(false);
  const [aiDismissed, setAiDismissed] = useState(false);
  const [gpsLoading, setGpsLoading] = useState(false);
  const [gpsField, setGpsField] = useState(null); // 'from' | 'to'
  const fileRef = useRef(null);

  const handleGPS = async (field) => {
    setGpsLoading(true); setGpsField(field);
    try {
      const addr = await getCurrentAddress();
      set(field, addr);
    } catch (e) {
      alert('Could not get location: ' + e + '\nMake sure location is enabled for your browser.');
    } finally {
      setGpsLoading(false); setGpsField(null);
    }
  };

  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const ded = parseFloat(form.miles) ? deduction(parseFloat(form.miles), form.category) : 0;

  // Live AI suggestion (when user has filled some text but not committed category yet)
  const suggestion = (prefs.aiSuggestions && (form.from || form.to || form.purpose))
    ? aiSuggest(form, allTrips) : null;
  const showAI = suggestion && !aiDismissed && (
    (suggestion.category && suggestion.category !== form.category) ||
    (suggestion.business && suggestion.business !== form.entity)
  );

  const irs = irsCheck(form);

  const handlePhoto = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => set('photo', { name: file.name, dataUrl: reader.result, type: file.type });
    reader.readAsDataURL(file);
  };

  const handleSave = () => {
    setSaved(true);
    setTimeout(() => { onSave(form); onClose(); }, 1000);
  };

  if (saved) return (
    <div style={{ background: '#F2F2F7', minHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 16 }} className="screen-anim">

  return (

      <div style={{ padding: '12px 16px 0' }}>

              </div>
            </div>
            {[

              ['Category', form.category],
              ['Est. Deduction', ded > 0 ? fmt$(ded) : 'None'],

          </div>

          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={() => setStep(2)} style={{
              flex: 1, padding: '16px', borderRadius: 14, border: '1.5px solid #E5E5EA',

                flex: 2, padding: '16px', borderRadius: 14, border: 'none',

function TripRouteMap({ coords, accent }) {
  const mapDiv = useRef(null);
  const mapObj = useRef(null);
  useEffect(() => {
    if (!mapDiv.current || mapObj.current) return;
    const map = L.map(mapDiv.current, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const line = L.polyline(coords, { color: accent, weight: 5, opacity: 0.9 }).addTo(map);
    // Start/end markers
    const mkIcon = (color) => L.divIcon({
      html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`,
      className:'', iconSize:[12,12], iconAnchor:[6,6]
    });
    L.marker(coords[0], { icon: mkIcon('#34C759') }).addTo(map);
    L.marker(coords[coords.length-1], { icon: mkIcon('#FF3B30') }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [20, 20] });
    mapObj.current = map;
    setTimeout(() => map.invalidateSize(), 100);
  }, []);
  return (
    <div style={{ borderRadius: 14, overflow: 'hidden', marginBottom: 14, height: 200, position: 'relative' }}>
      <div ref={mapDiv} style={{ width: '100%', height: '100%' }}/>
      <div style={{ position:'absolute', top:8, left:8, background:'rgba(255,255,255,0.9)', borderRadius:8, padding:'4px 8px', fontSize:11, fontWeight:700, color:'#1a1a1a', backdropFilter:'blur(4px)', zIndex:999 }}>
        GPS Route
      </div>
    </div>
  );
}

function TripDetail({ trip, accent, onClose, onDelete, onUpdate }) {
  const [editing, setEditing] = useState(false);
  const [buf, setBuf] = useState({ ...trip });
  const [saved, setSaved] = useState(false);

  const set = (k, v) => setBuf(b => ({ ...b, [k]: v }));

  const saveEdit = () => {
    const updated = { ...buf, miles: parseFloat(buf.miles) || 0 };
    onUpdate(updated);
    setSaved(true);
    setTimeout(() => { setSaved(false); setEditing(false); }, 800);
  };

  const display = editing ? buf : trip;
  const c = CAT_COLORS[display.category] || CAT_COLORS['Personal'];
  const ded = deduction(parseFloat(display.miles) || 0, display.category);

  const inputStyle = {
    width: '100%', padding: '10px 12px', borderRadius: 10, outline: 'none',
    border: `1.5px solid ${accent}40`, background: '#F9F9FB',
    fontSize: 14, fontWeight: 500, color: '#1a1a1a', boxSizing: 'border-box',
  };
  const labelStyle = { fontSize: 11, fontWeight: 700, color: '#8E8E93', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 5 };

  return (
    <div style={{ position: 'absolute', inset: 0, background: 'white', zIndex: 200, overflowY: 'auto' }} className="slide-up-anim">
      {/* Header */}
      <div style={{ background: `linear-gradient(160deg, ${c.bg} 0%, ${c.bg}BB 100%)`, padding: '52px 20px 20px', position: 'relative' }}>
        <button onClick={onClose} style={{
          position: 'absolute', top: 14, left: 16, width: 32, height: 32, borderRadius: '50%',
          background: 'rgba(255,255,255,0.25)', border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center', outline: 'none',
        }}>
          <Icon name="x" size={16} color="white" strokeWidth={2.5}/>
        </button>
        <button onClick={() => { if (editing) saveEdit(); else { setBuf({...trip}); setEditing(true); } }} style={{
          position: 'absolute', top: 14, right: 16,
          background: editing ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.25)',
          border: 'none', borderRadius: 20, cursor: 'pointer', outline: 'none',
          padding: '6px 14px', fontSize: 13, fontWeight: 700,
          color: editing ? c.bg : 'white',
        }}>
          {saved ? '✓ Saved' : editing ? 'Save' : 'Edit'}
        </button>
        {editing && (
          <button onClick={() => setEditing(false)} style={{
            position: 'absolute', top: 14, right: 80,
            background: 'rgba(255,255,255,0.2)', border: 'none', borderRadius: 20,
            cursor: 'pointer', outline: 'none', padding: '6px 12px',
            fontSize: 13, fontWeight: 600, color: 'white',
          }}>Cancel</button>
        )}
        <div style={{ color: 'rgba(255,255,255,0.75)', fontSize: 12, marginBottom: 4 }}>{fmtDate(display.date)}</div>
        <div style={{ color: 'white', fontSize: 30, fontWeight: 800, lineHeight: 1.1, marginBottom: 2 }}>
          {fmtMi(parseFloat(display.miles) || 0)}
        </div>
        {ded > 0 && <div style={{ color: 'rgba(255,255,255,0.85)', fontSize: 15, fontWeight: 600, marginBottom: 6 }}>
          {fmt$(ded)} deductible
        </div>}
        <CatPill cat={display.category}/>
      </div>

      <div style={{ padding: '20px 16px', paddingBottom: 100 }}>
        {!editing ? (
          <>
            {/* Route map — shown for GPS-tracked trips */}
            {trip.coords && trip.coords.length > 1 && (
              <TripRouteMap coords={trip.coords} accent={accent}/>
            )}

            {/* Route addresses (if available) */}
            {(trip.from || trip.to) && (
              <div style={{ background: '#F2F2F7', borderRadius: 14, padding: 14, marginBottom: 14 }}>
                <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 2 }}>
                    <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#34C759' }}/>
                    <div style={{ width: 2, height: 26, background: '#E5E5EA', margin: '3px 0' }}/>
                    <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#FF3B30' }}/>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: '#1a1a1a', marginBottom: 20, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{trip.from || '—'}</div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: '#1a1a1a', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{trip.to || '—'}</div>
                  </div>
                </div>
              </div>
            )}
            {[
              ['Purpose', trip.purpose],
              ['IRS Rate', `$${IRS_RATES[trip.category]}/mile`],
              trip.entity ? ['Entity/Client', trip.entity] : null,
              trip.notes ? ['Notes', trip.notes] : null,
              ['Tax Year', new Date(trip.date).getFullYear() || '2026'],
            ].filter(Boolean).map(([k,v]) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
                padding: '12px 0', borderBottom: '0.5px solid #F0F0F5' }}>
                <span style={{ fontSize: 14, color: '#8E8E93' }}>{k}</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: '#1a1a1a', maxWidth: '60%', textAlign: 'right' }}>{v}</span>
              </div>
            ))}
            <button onClick={() => onDelete(trip.id)} style={{
              width: '100%', marginTop: 24, padding: '14px', borderRadius: 12,
              background: '#FFF0EE', border: 'none', color: '#FF3B30',
              fontSize: 15, fontWeight: 600, cursor: 'pointer', outline: 'none',
            }}>Delete Trip</button>
          </>
        ) : (
          <>
            {/* Edit form */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div>
                <div style={labelStyle}>Miles</div>
                <input style={inputStyle} type="number" step="0.1" value={buf.miles}
                  onChange={e => set('miles', e.target.value)}/>
              </div>
              <div>
                <div style={labelStyle}>Date</div>
                <input style={inputStyle} type="date" value={buf.date}
                  onChange={e => set('date', e.target.value)}/>
              </div>
              <div>
                <div style={labelStyle}>From</div>
                <input style={inputStyle} type="text" value={buf.from}
                  onChange={e => set('from', e.target.value)} placeholder="Starting location"/>
              </div>
              <div>
                <div style={labelStyle}>To</div>
                <input style={inputStyle} type="text" value={buf.to}
                  onChange={e => set('to', e.target.value)} placeholder="Destination"/>
              </div>
              <div>
                <div style={labelStyle}>Purpose</div>
                <input style={inputStyle} type="text" value={buf.purpose}
                  onChange={e => set('purpose', e.target.value)} placeholder="Trip purpose"/>
              </div>
              <div>
                <div style={labelStyle}>Category</div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {Object.keys(CAT_COLORS).map(cat => (
                    <button key={cat} onClick={() => set('category', cat)} style={{
                      padding: '8px 14px', borderRadius: 20, border: 'none', cursor: 'pointer',
                      fontSize: 13, fontWeight: 600, outline: 'none',
                      background: buf.category === cat ? CAT_COLORS[cat].bg : '#F2F2F7',
                      color: buf.category === cat ? 'white' : '#3a3a3c',
                    }}>{cat}</button>
                  ))}
                </div>
              </div>
              <div>
                <div style={labelStyle}>Notes</div>
                <textarea style={{ ...inputStyle, minHeight: 80, resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5 }}
                  value={buf.notes || ''} onChange={e => set('notes', e.target.value)}
                  placeholder="Add any notes about this trip…"/>
              </div>
            </div>
            <button onClick={saveEdit} style={{
              width: '100%', marginTop: 20, padding: '15px', borderRadius: 14,
              background: accent, border: 'none', color: 'white',
              fontSize: 16, fontWeight: 700, cursor: 'pointer', outline: 'none',
            }}>{saved ? '✓ Saved!' : 'Save Changes'}</button>
            <button onClick={() => onDelete(trip.id)} style={{
              width: '100%', marginTop: 10, padding: '14px', borderRadius: 12,
              background: '#FFF0EE', border: 'none', color: '#FF3B30',
              fontSize: 15, fontWeight: 600, cursor: 'pointer', outline: 'none',
            }}>Delete Trip</button>
          </>
        )}
      </div>
    </div>
  );
}

// ─── REPORTS SCREEN ─────────────────────────────────────────────
function ReportsScreen({ trips, accent, onTripPress }) {
  const [year, setYear] = useState('2026');
  const [tab, setTab] = useState('summary');
  // drill: null | {category} | {category, business}
  const [drill, setDrill] = useState(null);
  const years = ['2026','2025','2024','2023'];

  const yearTrips = trips; // All sample trips are current year
  const totalMiles = yearTrips.reduce((s,t)=>s+t.miles,0);
  const totalDed = yearTrips.reduce((s,t)=>s+deduction(t.miles,t.category),0);

  const byCat = {};
  yearTrips.forEach(t => {
    if (!byCat[t.category]) byCat[t.category] = { miles: 0, ded: 0, count: 0 };
    byCat[t.category].miles += t.miles;
    byCat[t.category].ded += deduction(t.miles, t.category);
    byCat[t.category].count++;
  });

  // Business breakdown — only for Business category
  const businessTrips = yearTrips.filter(t => t.category === 'Business');
  const byBiz = {};
  businessTrips.forEach(t => {
    const key = businessOf(t.entity) || 'Other';
    if (!byBiz[key]) byBiz[key] = { miles: 0, ded: 0, count: 0, trips: [] };
    byBiz[key].miles += t.miles;
    byBiz[key].ded += deduction(t.miles, t.category);
    byBiz[key].count++;
    byBiz[key].trips.push(t);
  });
  const businessTotalMiles = businessTrips.reduce((s,t)=>s+t.miles,0);

  // Drill-down detail data
  let drillTrips = [];
  let drillTitle = '', drillSubtitle = '', drillColor = accent, drillLight = '#F2F2F7';
  if (drill) {
    if (drill.business) {
      const info = BUSINESS_INFO[drill.business];
      drillTrips = (byBiz[drill.business]?.trips) || [];
      drillTitle = info ? info.full : drill.business;
      drillSubtitle = info ? info.desc : 'Business trips';
      drillColor = info ? info.color : accent;
      drillLight = info ? info.light : '#F2F2F7';
    } else if (drill.category) {
      drillTrips = yearTrips.filter(t => t.category === drill.category);
      drillTitle = drill.category;
      drillSubtitle = `${drillTrips.length} trip${drillTrips.length !== 1 ? 's' : ''} this year`;
      drillColor = CAT_COLORS[drill.category]?.bg || accent;
      drillLight = CAT_COLORS[drill.category]?.light || '#F2F2F7';
    }
  }

  return (
    <div style={{ background: '#F2F2F7', minHeight: '100%', paddingBottom: 100 }} className="screen-anim">
      {/* Year selector */}
      <div style={{ padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'white', borderBottom: '0.5px solid #F0F0F5' }}>
        <span style={{ fontSize: 15, fontWeight: 600, color: '#1a1a1a' }}>Mileage Report</span>
        <select value={year} onChange={e=>setYear(e.target.value)} style={{
          background: `${accent}15`, border: 'none', borderRadius: 8, padding: '6px 10px',
          fontSize: 14, fontWeight: 700, color: accent, fontFamily: 'Inter, sans-serif', outline: 'none',
        }}>
          {years.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
      </div>

      {/* Summary cards */}
      <div style={{ padding: '16px 16px 0', display: 'flex', gap: 10 }}>
        <div style={{ flex: 1, background: 'white', borderRadius: 14, padding: '14px 14px',
          boxShadow: '0 1px 4px rgba(0,0,0,0.06)', textAlign: 'center' }}>
          <div style={{ fontSize: 24, fontWeight: 800, color: '#1a1a1a' }}>{totalMiles.toFixed(0)}</div>
          <div style={{ fontSize: 11, color: '#8E8E93', marginTop: 2 }}>Total Miles</div>
        </div>
        <div style={{ flex: 1, background: 'white', borderRadius: 14, padding: '14px 14px',
          boxShadow: '0 1px 4px rgba(0,0,0,0.06)', textAlign: 'center' }}>
          <div style={{ fontSize: 24, fontWeight: 800, color: '#34C759' }}>{fmt$(totalDed)}</div>
          <div style={{ fontSize: 11, color: '#8E8E93', marginTop: 2 }}>Est. Deduction</div>
        </div>
        <div style={{ flex: 1, background: 'white', borderRadius: 14, padding: '14px 14px',
          boxShadow: '0 1px 4px rgba(0,0,0,0.06)', textAlign: 'center' }}>
          <div style={{ fontSize: 24, fontWeight: 800, color: '#1a1a1a' }}>{yearTrips.length}</div>
          <div style={{ fontSize: 11, color: '#8E8E93', marginTop: 2 }}>Trips</div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ padding: '12px 16px 0' }}>
        <div style={{ display: 'flex', gap: 4, background: 'rgba(142,142,147,0.12)', borderRadius: 10, padding: 3 }}>
          {['summary','itemized'].map(t => (
            <button key={t} onClick={()=>{setTab(t); setDrill(null);}} style={{
              flex: 1, padding: '7px', borderRadius: 8, border: 'none',
              background: tab === t ? 'white' : 'none',
              color: tab === t ? '#1a1a1a' : '#8E8E93',
              fontSize: 13, fontWeight: tab === t ? 700 : 500, cursor: 'pointer',
              outline: 'none', boxShadow: tab === t ? '0 1px 4px rgba(0,0,0,0.08)' : 'none',
              textTransform: 'capitalize', transition: 'all 0.15s',
            }}>{t.charAt(0).toUpperCase() + t.slice(1)}</button>
          ))}
        </div>
      </div>

      {tab === 'summary' && !drill && (
        <div style={{ padding: '12px 16px 0' }} className="screen-anim">
          {Object.entries(byCat).map(([cat, data]) => {
            const c = CAT_COLORS[cat];
            const pct = (data.miles / totalMiles * 100);
            const isBusiness = cat === 'Business';
            return (
              <button key={cat} onClick={() => setDrill({ category: cat })} style={{
                width: '100%', textAlign: 'left', cursor: 'pointer', outline: 'none',
                background: 'white', borderRadius: 14, padding: '14px 16px',
                marginBottom: 10, boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
                border: 'none', fontFamily: 'inherit',
                transition: 'transform 0.12s',
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <CatPill cat={cat}/>
                    <span style={{ fontSize: 12, color: '#8E8E93' }}>{data.count} trip{data.count !== 1 ? 's' : ''}</span>
                    {isBusiness && (
                      <span style={{ fontSize: 10, fontWeight: 700, color: c.text,
                        background: c.light, padding: '2px 7px', borderRadius: 10 }}>
                        {Object.keys(byBiz).length} entities
                      </span>
                    )}
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: '#1a1a1a' }}>{data.miles.toFixed(1)} mi</div>
                      {data.ded > 0 && <div style={{ fontSize: 11, color: '#34C759', fontWeight: 600 }}>{fmt$(data.ded)}</div>}
                    </div>
                    <Icon name="chevronR" size={14} color="#C7C7CC"/>
                  </div>
                </div>
                <div style={{ height: 5, background: '#F2F2F7', borderRadius: 3 }}>
                  <div style={{ height: '100%', width: `${pct}%`, background: c.bg, borderRadius: 3, transition: 'width 0.6s ease' }}/>
                </div>
                <div style={{ fontSize: 11, color: '#8E8E93', marginTop: 4 }}>
                  {pct.toFixed(0)}% of total miles{isBusiness ? ' · Tap to drill into businesses' : ''}
                </div>
              </button>
            );
          })}

          {/* IRS Rates table */}
          <div style={{ background: 'white', borderRadius: 14, overflow: 'hidden',
            boxShadow: '0 1px 4px rgba(0,0,0,0.06)', marginBottom: 12 }}>
            <div style={{ padding: '12px 16px', borderBottom: '0.5px solid #F0F0F5',
              fontSize: 11, fontWeight: 700, color: '#8E8E93', textTransform: 'uppercase', letterSpacing: 0.5 }}>
              2026 IRS Rates
            </div>
            {Object.entries(IRS_RATES).map(([cat, rate]) => (
              <div key={cat} style={{ padding: '10px 16px', borderBottom: '0.5px solid #F0F0F5',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <CatPill cat={cat} small/>
                <span style={{ fontSize: 13, fontWeight: 600, color: rate > 0 ? '#34C759' : '#8E8E93' }}>
                  {rate > 0 ? `$${rate}/mile` : 'No deduction'}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* DRILL-DOWN: Business category → list of businesses */}
      {tab === 'summary' && drill && drill.category === 'Business' && !drill.business && (
        <div style={{ padding: '12px 16px 0' }} className="screen-anim">
          {/* Breadcrumb */}
          <button onClick={() => setDrill(null)} style={{
            display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none',
            padding: '4px 0 12px', cursor: 'pointer', outline: 'none', color: accent,
            fontSize: 14, fontWeight: 600, fontFamily: 'inherit',
          }}>
            <Icon name="chevronL" size={14} color={accent}/> Back to Categories
          </button>

          <div style={{ background: `linear-gradient(135deg, ${CAT_COLORS.Business.bg} 0%, ${CAT_COLORS.Business.bg}CC 100%)`,
            borderRadius: 16, padding: '14px 16px', marginBottom: 12, color: 'white' }}>
            <div style={{ fontSize: 11, opacity: 0.8, marginBottom: 2 }}>BUSINESS · {year}</div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>{businessTotalMiles.toFixed(1)} mi</div>
            <div style={{ fontSize: 12, opacity: 0.85, marginTop: 2 }}>
              {fmt$(businessTrips.reduce((s,t)=>s+deduction(t.miles,t.category),0))} deduction · {businessTrips.length} trips · {Object.keys(byBiz).length} entities
            </div>
          </div>

          <div style={{ fontSize: 11, fontWeight: 700, color: '#8E8E93', textTransform: 'uppercase',
            letterSpacing: 0.5, padding: '0 4px 8px' }}>By Entity</div>

          {Object.entries(byBiz).sort((a,b) => b[1].miles - a[1].miles).map(([biz, data]) => {
            const info = BUSINESS_INFO[biz] || { full: biz, desc: 'Other business', color: '#8E8E93', light: '#F2F2F7' };
            const pct = (data.miles / businessTotalMiles * 100);
            return (
              <button key={biz} onClick={() => setDrill({ category: 'Business', business: biz })} style={{
                width: '100%', textAlign: 'left', cursor: 'pointer', outline: 'none',
                background: 'white', borderRadius: 14, padding: '14px 16px',
                marginBottom: 10, boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
                border: 'none', fontFamily: 'inherit',
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: info.light,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    <span style={{ fontSize: 13, fontWeight: 800, color: info.color, letterSpacing: 0.3 }}>{biz}</span>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: '#1a1a1a' }}>{info.full}</div>
                    <div style={{ fontSize: 11, color: '#8E8E93' }}>{info.desc} · {data.count} trip{data.count !== 1 ? 's' : ''}</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: '#1a1a1a' }}>{data.miles.toFixed(1)} mi</div>
                    <div style={{ fontSize: 11, color: '#34C759', fontWeight: 600 }}>{fmt$(data.ded)}</div>
                  </div>
                  <Icon name="chevronR" size={14} color="#C7C7CC"/>
                </div>
                <div style={{ height: 5, background: '#F2F2F7', borderRadius: 3 }}>
                  <div style={{ height: '100%', width: `${pct}%`, background: info.color, borderRadius: 3, transition: 'width 0.6s ease' }}/>
                </div>
                <div style={{ fontSize: 11, color: '#8E8E93', marginTop: 4 }}>{pct.toFixed(0)}% of business miles</div>
              </button>
            );
          })}
        </div>
      )}

      {/* DRILL-DOWN: Specific business → trip-level detail */}
      {tab === 'summary' && drill && drill.business && (
        <div style={{ padding: '12px 16px 0' }} className="screen-anim">
          <button onClick={() => setDrill({ category: 'Business' })} style={{
            display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none',
            padding: '4px 0 12px', cursor: 'pointer', outline: 'none', color: drillColor,
            fontSize: 14, fontWeight: 600, fontFamily: 'inherit',
          }}>
            <Icon name="chevronL" size={14} color={drillColor}/> Back to Businesses
          </button>

          <div style={{ background: `linear-gradient(135deg, ${drillColor} 0%, ${drillColor}CC 100%)`,
            borderRadius: 16, padding: '16px', marginBottom: 12, color: 'white' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
              <div style={{ width: 44, height: 44, borderRadius: 12, background: 'rgba(255,255,255,0.2)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <span style={{ fontSize: 14, fontWeight: 800, color: 'white' }}>{drill.business}</span>
              </div>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700 }}>{drillTitle}</div>
                <div style={{ fontSize: 11, opacity: 0.8 }}>{drillSubtitle}</div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 16, paddingTop: 10, borderTop: '1px solid rgba(255,255,255,0.2)' }}>
              <div>
                <div style={{ fontSize: 10, opacity: 0.7 }}>MILES</div>
                <div style={{ fontSize: 20, fontWeight: 800 }}>{drillTrips.reduce((s,t)=>s+t.miles,0).toFixed(1)}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, opacity: 0.7 }}>DEDUCTION</div>
                <div style={{ fontSize: 20, fontWeight: 800 }}>{fmt$(drillTrips.reduce((s,t)=>s+deduction(t.miles,t.category),0))}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, opacity: 0.7 }}>TRIPS</div>
                <div style={{ fontSize: 20, fontWeight: 800 }}>{drillTrips.length}</div>
              </div>
            </div>
          </div>

          {/* Top destinations */}
          {(() => {
            const destMap = {};
            drillTrips.forEach(t => {
              const d = shortAddr(t.to);
              destMap[d] = (destMap[d] || 0) + t.miles;
            });
            const topDests = Object.entries(destMap).sort((a,b) => b[1] - a[1]).slice(0,3);
            const topMax = topDests[0]?.[1] || 1;
            return (
              <div style={{ background: 'white', borderRadius: 14, padding: '12px 16px',
                marginBottom: 12, boxShadow: '0 1px 4px rgba(0,0,0,0.06)' }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#8E8E93', textTransform: 'uppercase',
                  letterSpacing: 0.5, marginBottom: 10 }}>Top Destinations</div>
                {topDests.map(([dest, mi]) => (
                  <div key={dest} style={{ marginBottom: 8 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
                      <span style={{ fontSize: 13, fontWeight: 500, color: '#1a1a1a',
                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{dest}</span>
                      <span style={{ fontSize: 12, fontWeight: 600, color: drillColor }}>{mi.toFixed(1)} mi</span>
                    </div>
                    <div style={{ height: 4, background: '#F2F2F7', borderRadius: 2 }}>
                      <div style={{ height: '100%', width: `${(mi/topMax*100)}%`, background: drillColor, borderRadius: 2 }}/>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}

          <div style={{ fontSize: 11, fontWeight: 700, color: '#8E8E93', textTransform: 'uppercase',
            letterSpacing: 0.5, padding: '0 4px 8px' }}>All Trips</div>
          <div style={{ background: 'white', borderRadius: 16, overflow: 'hidden',
            boxShadow: '0 1px 4px rgba(0,0,0,0.06)' }}>
            {drillTrips.map(trip => (
              <TripRow key={trip.id} trip={trip} accent={drillColor} onPress={() => onTripPress && onTripPress(trip)}/>
            ))}
          </div>

          <button style={{
            width: '100%', marginTop: 14, padding: '13px', borderRadius: 12, border: 'none',
            background: drillColor, color: 'white', fontSize: 14, fontWeight: 700,
            cursor: 'pointer', outline: 'none',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          }}>
            <Icon name="download" size={16} color="white"/>
            Export {drill.business} Report
          </button>
        </div>
      )}

      {/* DRILL-DOWN: Non-business category → trip detail */}
      {tab === 'summary' && drill && drill.category && drill.category !== 'Business' && (
        <div style={{ padding: '12px 16px 0' }} className="screen-anim">
          <button onClick={() => setDrill(null)} style={{

            const url = URL.createObjectURL(blob);

            a.href = url; a.download = `MileVault_${year}_IRS_report.txt`; a.click();

            cursor:'pointer', outline:'none', boxShadow:'0 1px 4px rgba(0,0,0,0.06)',
            display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>

            const totMi = yearTrips.reduce((s,t)=>s+t.miles,0);
            const totDed = yearTrips.reduce((s,t)=>s+deduction(t.miles,t.category),0);
            w.document.write(`<!DOCTYPE html><html><head><title>MileVault ${year} Report</title>
              <style>body{font-family:-apple-system,sans-serif;padding:32px;color:#1a1a1a}
              h1{font-size:24px;margin-bottom:4px}p.sub{color:#8E8E93;margin:0 0 24px}
              .stats{display:flex;gap:20px;margin-bottom:24px}
              .stat{background:#F2F2F7;padding:12px 16px;border-radius:10px;min-width:100px}
              .stat-val{font-size:22px;font-weight:800}.stat-lbl{font-size:11px;color:#8E8E93;margin-top:2px}
              table{width:100%;border-collapse:collapse;font-size:13px}
              th{text-align:left;padding:8px 10px;background:#F2F2F7;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
              td{padding:9px 10px;border-bottom:1px solid #F0F0F5}
              .ded{color:#34C759;font-weight:700}
              @media print{.no-print{display:none}}</style></head><body>
              <h1>MileVault Pro — ${year} Mileage Report</h1>
              <p class="sub">Generated ${new Date().toLocaleDateString()} · IRS-Compliant</p>
              <div class="stats">
                <div class="stat"><div class="stat-val">${totMi.toFixed(1)} mi</div><div class="stat-lbl">Total Miles</div></div>
                <div class="stat"><div class="stat-val" style="color:#34C759">$${totDed.toFixed(2)}</div><div class="stat-lbl">Est. Deduction</div></div>
                <div class="stat"><div class="stat-val">${yearTrips.length}</div><div class="stat-lbl">Trips</div></div>
              </div>
              <table><thead><tr><th>Date</th><th>Miles</th><th>Category</th><th>Entity</th><th>Purpose</th><th>Deduction</th></tr></thead><tbody>
              ${yearTrips.map(t=>`<tr><td>${t.date}</td><td>${t.miles.toFixed(1)}</td><td>${t.category}</td><td>${t.entity||'—'}</td><td>${t.purpose||''}</td><td class="ded">$${deduction(t.miles,t.category).toFixed(2)}</td></tr>`).join('')}
              </tbody></table>
              <p style="margin-top:24px;font-size:11px;color:#8E8E93">IRS Rates 2026: Business $0.67/mi · Medical $0.21/mi · Charity $0.14/mi</p>
              <button class="no-print" onclick="window.print()" style="margin-top:16px;padding:12px 24px;background:#007AFF;color:white;border:none;border-radius:10px;font-size:15px;cursor:pointer">Save as PDF</button>
              </body></html>`);
            w.document.close();
          }} style={{ flex:1, padding:'14px 8px', borderRadius:12, border:'none', background:'white',
            cursor:'pointer', outline:'none', boxShadow:'0 1px 4px rgba(0,0,0,0.06)',
            display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
            <Icon name="download" size={20} color={accent}/>
            <div style={{ fontSize:11, fontWeight:700, color:'#3a3a3c' }}>PDF Report</div>
            <div style={{ fontSize:9, color:'#8E8E93' }}>Print / share</div>
          </button>
        </div>
      </div>
    </div>
  );
}

                {plan === 'trial' ? 'Renews after trial' : 'Renews monthly'}

                width:'100%', padding:'10px', borderRadius:10, border:'none',
                background:'rgba(255,255,255,0.2)', color:'white', fontSize:12, fontWeight:700,

                display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
                🎁 Refer friends → free months

        boxShadow: '0 1px 4px rgba(0,0,0,0.06)', overflow: 'hidden' }}>
        <div style={{ padding: '10px 16px', fontSize: 11, color: '#8E8E93', fontWeight: 700,

        <Row label="Notifications" icon="bell" iconBg={accent}

        <Row label="GPS Auto-Track" detail="Record routes automatically" icon="map" iconBg="#34C759"

        <Row label="Dark Mode" icon="settings" iconBg="#3a3a3c"

        boxShadow: '0 1px 4px rgba(0,0,0,0.06)', overflow: 'hidden' }}>
        <div style={{ padding: '10px 16px', fontSize: 11, color: '#8E8E93', fontWeight: 700,
          textTransform: 'uppercase', letterSpacing: 0.5 }}>Account</div>
        <div onClick={onShowEntities} style={{ cursor:'pointer' }}>
          <Row label="Business Entities" detail={Object.keys(BUSINESS_INFO).join(' · ') || 'No entities yet'} icon="building" iconBg="#007AFF"/>
        </div>
        <div onClick={() => alert('IRS Mileage Rates 2026:\n• Business: $0.67/mile\n• Medical: $0.21/mile\n• Charity: $0.14/mile\n• Moving: $0.21/mile')} style={{ cursor:'pointer' }}>
          <Row label="IRS Rate Info" detail="2026 rates" icon="dollar" iconBg="#FF9500"/>

        </div>
        <div onClick={() => { window.location.href = 'mailto:tdalton508@gmail.com?subject=MileVault Support'; }} style={{ cursor:'pointer' }}>
          <Row label="Help & Support" detail="Email Tyler" icon="help" iconBg="#8E8E93"/>
        </div>
        <div onClick={() => alert('MileVault Pro Privacy Policy:\n\nYour trip data is stored only on your device. We collect your name, email, and phone at signup to manage your account. Trip data, GPS routes, and mileage details never leave your device. We do not sell your data.')} style={{ cursor:'pointer' }}>
          <Row label="Privacy Policy" icon="lock" iconBg="#3a3a3c"/>
        </div>
      </div>

      <div style={{ margin: '0 16px', background: 'white', borderRadius: 16,
        boxShadow: '0 1px 4px rgba(0,0,0,0.06)', overflow: 'hidden' }}>
